<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>

    <div id="container">
        <div id="theme-toggle-container">
            <h3>Theme Toggle Example</h3>
            <p>
                Current theme: <strong id="current-theme">light</strong>
            </p>
            <button id="theme-toggle-button">
                Toggle to <span id="theme-toggle-label">dark</span> mode
            </button>
            <p style="margin-top: 15px; font-size: 0.9em;">
                This preference is saved in <code>localStorage</code> and will persist
                if you refresh the page or close and reopen the browser.
            </p>
        </div>
    </div>

    <script src="/script.js"></script>

</body>

</html>
