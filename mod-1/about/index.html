<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="container">
        <header>
            <h1>About Me</h1>
        </header>

        <section class="card">
            <p><strong>Name:</strong> Jade "ha-day"</p>
            <p><strong>Pronouns:</strong> {pronouns}</p>

            <p><strong>My level of coding skill/experience is: </strong>{number from 1-10}</p>
            <h2>Fun Facts:</h2>
            
            <ul>
                <li>{fact #1}</li>
                <li>{fact #2}</li>
                <li>{fact #3}</li>
            </ul>
        </section>

    </main>

</body>

</html>
